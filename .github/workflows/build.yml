name: Build and Push Docker Image

on: [push]

env:
  GH_PAT: ${{ secrets.GH_PAT }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  IMAGE_NAME: gitkdf/cups-label-printer

jobs:
  build-elf:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'process_labels.py')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install pymupdf
          pip install pillow
          pip install opencv-python-headless
          pip install numpy
          pip install argparse

      - name: Build executable
        run: pyinstaller --onefile process_labels.py

      - name: Split the ELF file into 50MB chunks
        run: split -b 50m dist/process_labels dist/process_labels_split_part_

      - name: Add split parts to Git
        run: git add dist/process_labels_split_part_*

      - name: Configure Git identity
        run: |
          git config user.name ${{ secrets.GIT_USER_NAME }}
          git config user.email ${{ secrets.GIT_USER_EMAIL }}

      - name: Commit changes
        run: git commit -m "Build and push ELF file (split to 50MB)"

      - name: Push to repository
        run: git push origin main

  build-docker:
    runs-on: ubuntu-latest
    needs: [build-elf]
    if: always()
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm/v7
            arch: armv7
          - platform: linux/arm64/v8
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
          registry: docker.io

      - name: Determine tag
        id: determine_tag
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "TAG=latest" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == "refs/heads/development" ]]; then
            echo "TAG=development" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=${GITHUB_REF#refs/heads/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.determine_tag.outputs.TAG }}-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDPLATFORM=${{ runner.os }}-${{ runner.arch }}
            TARGETPLATFORM=${{ matrix.platform }}

      - name: Create and push manifest list
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.determine_tag.outputs.TAG }}
          manifest: ${{ env.IMAGE_NAME }}:${{ steps.determine_tag.outputs.TAG }}
          platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
