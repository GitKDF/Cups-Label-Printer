name: Build and Push Docker Image

on: [push]

env:
  # GH_PAT and related git commit steps are no longer needed as ELF is not committed
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  IMAGE_NAME: gitkdf/cups-label-printer

jobs:
  # Removed the build-elf job

  build-docker:
    runs-on: ubuntu-latest # The runner OS is sufficient with buildx
    # Removed needs: [build-elf]
    # No strategy.matrix needed here for the build step itself if building all platforms at once

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        # This action registers the QEMU binaries needed for cross-compilation
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
          registry: docker.io

      - name: Determine tag
        id: determine_tag
        run: |
          # Determine the tag based on the ref
          TAG=""
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            TAG="latest"
          elif [[ "${GITHUB_REF}" == "refs/heads/development" ]]; then
            TAG="development"
          else
            # Use branch name, sanitize for Docker tag
            TAG=$(echo "${GITHUB_REF#refs/heads/}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          fi
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Determined tag: ${TAG}"

      - name: Build and push multi-platform Docker image
        uses: docker/build-push-action@v5
        with:
          # Specify all platforms to build
          platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
          push: true # Push the images and create the manifest list
          tags: ${{ env.IMAGE_NAME }}:${{ steps.determine_tag.outputs.TAG }} # The main tag for the manifest list
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: . # The build context (usually the root of your repo)
          file: Dockerfile # Path to your Dockerfile

      # Removed the separate manifest list step, build-push-action handles it
